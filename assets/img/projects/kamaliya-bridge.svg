<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1a33"/><stop offset=".7" stop-color="#2a4675"/><stop offset="1" stop-color="#b07a4a"/></linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ede4d6"/><stop offset="1" stop-color="#bfb29c"/></linearGradient>
    <linearGradient id="pier" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9cdb8"/><stop offset="1" stop-color="#9f927d"/></linearGradient>
    <linearGradient id="riv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a4675"/><stop offset="1" stop-color="#0b1a33"/></linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#sky)"/>
  <g fill="#f7f2ea" opacity=".6"><circle cx="140" cy="80" r="1.6"/><circle cx="300" cy="140" r="1.2"/><circle cx="520" cy="60" r="1.4"/><circle cx="820" cy="110" r="1.2"/><circle cx="1040" cy="70" r="1.6"/></g>
  <!-- city silhouette -->
  <path d="M0 420 V380 h40 v-30 h30 v40 h50 v-60 h40 v50 h60 v-20 h50 v40 h80 v-50 h30 v60 h90 v-30 h60 v40 h70 v-70 h40 v70 h90 v-40 h60 v30 h80 v-50 h40 v60 h90 v-30 h60 v50 V420z" fill="#0b1a33" opacity=".7"/>
  <rect y="430" width="1200" height="210" fill="url(#riv)"/>
  <!-- piers -->
  <g fill="url(#pier)">
    <rect x="260" y="330" width="44" height="200"/><rect x="580" y="330" width="44" height="200"/><rect x="900" y="330" width="44" height="200"/>
  </g>
  <g fill="#c8b9a0"><rect x="236" y="316" width="92" height="18" rx="3"/><rect x="556" y="316" width="92" height="18" rx="3"/><rect x="876" y="316" width="92" height="18" rx="3"/></g>
  <!-- abutments -->
  <path d="M0 300 H70 L40 640 H0z" fill="#9f927d"/><path d="M1200 300 H1130 L1160 640 H1200z" fill="#9f927d"/>
  <!-- deck girders -->
  <rect x="0" y="282" width="1200" height="36" fill="url(#deck)"/>
  <rect x="0" y="318" width="1200" height="4" fill="#7d705d"/>
  <g stroke="#a99a83" stroke-width="2"><path d="M282 282 v36 M602 282 v36 M922 282 v36 M122 282 v36 M442 282 v36 M762 282 v36 M1082 282 v36"/></g>
  <!-- parapet -->
  <rect x="0" y="262" width="1200" height="20" fill="#f7f2ea"/>
  <g stroke="#c8895a" stroke-width="3"><path d="M0 262 H1200"/></g>
  <!-- lamps -->
  <g stroke="#f7f2ea" stroke-width="3" fill="none"><path d="M160 262 V200 h18 M480 262 V200 h18 M800 262 V200 h18 M1120 262 V200 h18"/></g>
  <g fill="#e0ad80"><circle cx="180" cy="203" r="6"/><circle cx="500" cy="203" r="6"/><circle cx="820" cy="203" r="6"/><circle cx="1140" cy="203" r="6"/></g>
  <!-- reflections -->
  <g fill="#e0ad80" opacity=".35"><rect x="176" y="450" width="8" height="60" rx="4"/><rect x="496" y="450" width="8" height="60" rx="4"/><rect x="816" y="450" width="8" height="60" rx="4"/><rect x="1136" y="450" width="8" height="60" rx="4"/></g>
  <g stroke="#9fc0e0" stroke-width="2" opacity=".35" stroke-linecap="round"><path d="M80 560 h80 M340 590 h120 M700 570 h90 M1000 600 h110"/></g>
</svg>
