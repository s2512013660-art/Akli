    <path d="M520 420 q20 -6 40 0 t40 0"/><path d="M460 500 q24 -7 48 0 t48 0 t48 0"/><path d="M600 360 q12 -4 24 0 t24 0"/><path d="M420 590 q30 -8 60 0 t60 0 t60 0 t60 0"/>
