<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13264a"/><stop offset="1" stop-color="#2a4675"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f6a9a"/><stop offset="1" stop-color="#1d3560"/></linearGradient>
    <linearGradient id="conc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfc4b2"/><stop offset="1" stop-color="#ede4d6"/></linearGradient>
    <radialGradient id="sun" cx=".8" cy=".2" r=".5"><stop offset="0" stop-color="#e0ad80" stop-opacity=".55"/><stop offset="1" stop-color="#e0ad80" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#sky)"/>
  <rect width="1200" height="640" fill="url(#sun)"/>
  <circle cx="960" cy="120" r="46" fill="#e0ad80" opacity=".9"/>
