    <path d="M1100 300 q6 -70 2 -130 h6 q4 60 -2 130z"/><path d="M1105 170 q-55 -10 -75 18 q38 -28 75 -13 q-28 -36 -74 -28 q56 0 74 22 q9 -46 56 -56 q-38 18 -47 52 q46 -28 84 -6 q-46 -9 -93 11z"/>
  </g>
  <rect y="290" width="1200" height="30" fill="#0f2142"/>
