<script>
const D = {"slides":[{"master":"Ink","notes":"SCRIPT (~60 sec)\nGood morning, everyone. Look around this room for a moment. What do you see? Most people see walls, a floor, and a ceiling. But we don't live in the walls; we live in the space between them. Every building begins as an empty space, and architects spend their whole careers shaping that emptiness. The walls cost money, but the space is what we actually use. Today, I want to show you why the void, the empty space, matters more than the walls. Each slide follows one English tense, and the small gold marker at the bottom shows where that tense sits in time. We start with the Present Simple, the tense of facts and general truths: architecture shapes space, and space shapes us.\n\nTARGET TENSE: Present Simple (Subject + V1 / V-s): facts, general truths, permanent principles.\nTarget verbs: see, live, begins, spend, cost, is, use, want, matters, follows, shows, sits, start, shapes\nAlso used naturally: Present Simple questions and negatives (What do you see? / we don't live).\nWatch out: \"Space shape us\" \u2717 \u2192 \"Space shapes us\" \u2713 (third-person -s).\nDelivery tip: Pause after \"What do you see?\" and really look around the room. Let the silence work \u2014 it is empty space too.","items":[{"kind":"image","o":{"x":7.3500000000000005,"y":-0.19999999999999996,"w":4.9,"h":7.25,"objectName":"!!Glow","transparency":0,"src":"img/glow.webp"}},{"kind":"shape","type":"roundRect","o":{"x":8.55,"y":1,"w":2.5,"h":4.85,"rectRadius":0.04,"objectName":"!!Void","fill":{"color":"15130F"},"line":{"color":"E9B65A","width":1,"transparency":35}}},{"kind":"image","o":{"x":8.55,"y":1,"w":2.5,"h":4.85,"objectName":"door","src":"img/s1_door.webp"}},{"kind":"image","o":{"x":8.55,"y":1,"w":2.5,"h":4.85,"objectName":"person","src":"img/s1_person.webp"}},{"kind":"image","o":{"x":6.800000000000001,"y":5.85,"w":6,"h":1,"objectName":"spill","src":"img/s1_spill.webp"}},{"kind":"text","t":"UNIVERSITY ENGLISH  \u00b7  ARCHITECTURE enings into walls, and those empty openings made the room useful. Lao Tzu never designed a building, but he gave architecture its oldest lesson. This is the Past Simple. We use it for finished actions in the past: wrote, noticed, made, gave.\n\nTARGET TENSE: Past Simple (V2): finished actions at a finished time in the past.\nTarget verbs: wrote, noticed, missed, made, used, described, cut, made, designed (never designed), gave\nAlso used naturally: Present Simple (our story starts, we use it).\nWatch out: \"He didn't noticed\" \u2717 \u2192 \"He didn't notice\" \u2713 (after did/didn't use V1).\nDelivery tip: Point to the gold shape inside the pot when you say \"the empty space inside it.\"","items":[{"kind":"image","o":{"x":6.75,"y":-0.25,"w":7,"h":7,"objectName":"!!Glow","transparency":0,"src":"img/glow.webp"}},{"kind":"shape","type":"roundRect","o":{"x":7.95,"y":0.95,"w":4.6,"h":4.6,"rectRadius":2.3,"objectName":"!!Void","fill":{"color":"15130F"},"line":{"color":"E9B65A","width":1,"transparency":35}}},{"kind":"image","o":{"x":7.95,"y":0.95,"w":4.6,"h":4.6,"objectName":"wheel","src":"img/s2_wheel.webp"}},{"kind":"image","o":{"x":7.95,"y":0.95,"w":4.6,"h":4.6,"objectName":"pot","src":"img/s2_pot.webp"}},{"kind":"image","o":{"x":7.95,"y":0.95,"w":4.6,"h":4.6,"objectName":"potvoid","src":"img/s2_void.webp"}},{"kind":"text","t":"02  \u00b7  THE OLDEST IDEA","o":{"isTextBox":true,"margin":0,"valign":"top","fontFace":"Arial","paraSpaceAfter":0,"x":0.75,"y":0.95,"w":6.6,"h":0.25,"fontSize":10,"bold":true,"color":"E9B65A","charSpacing":3,"objectName":"!!Kicker"}},{"kind":"text","t":"The Usefulness of Nothing","o":{"isTextBox":true,"margin":0,"valign":"top","fontFace":"Georgia","paraSpaceAfter":0,"x":0.75,"y":1.28,"w":6.6,"h":1.25,"fontSize":38,"color":"F3EEE6","objectName":"!!Title","lineSpacingMultiple":0.95}},{"kind":"text","t":[{"text":"More than 2,000 years ago, Lao Tzu ","options":{"color":"F3EEE6"}},{"text":"noticed","options":{"color":"E9B65A","bold":true}},{"text"
